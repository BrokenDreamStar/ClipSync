name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-macos:
    name: 构建 macOS DMG
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: 安装前端依赖
        working-directory: frontend
        run: npm install

      - name: 构建 macOS 通用版 (Apple Silicon + Intel)
        run: wails build -platform darwin/universal

      - name: 重新生成 .app 图标
        run: sh build/darwin/build_icns.sh

      - name: 打包 DMG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version wails.json)"
          STAGE="$(mktemp -d)"
          cp -R "build/bin/ClipSync.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "ClipSync" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "build/bin/ClipSync-${VERSION}-macos-universal.dmg"

      - name: 上传 DMG 产物
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-macos
          path: build/bin/*.dmg
          if-no-files-found: error

  build-windows:
    name: 构建 Windows EXE
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: 安装前端依赖
        working-directory: frontend
        run: npm install

      - name: 构建 Windows amd64
        run: wails build -platform windows/amd64

      - name: 重命名产物 (带版本号)
        shell: bash
        run: |
          VERSION="$(jq -r .version wails.json)"
          mv build/bin/ClipSync.exe "build/bin/ClipSync-${VERSION}-windows-amd64.exe"

      - name: 上传 EXE 产物
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-windows
          path: build/bin/ClipSync-*-windows-amd64.exe
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        run: echo "version=$(jq -r .version wails.json)" >> "$GITHUB_OUTPUT"

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ClipSync v${{ steps.version.outputs.version }}
          files: artifacts/**/*
