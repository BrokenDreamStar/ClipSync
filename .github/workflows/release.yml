name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-macos:
    name: 构建 macOS DMG
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: 安装前端依赖
        working-directory: frontend
        run: npm install

      - name: 构建 macOS 通用版 (Apple Silicon + Intel)
        run: wails build -platform darwin/universal

      - name: 重新生成 .app 图标
        run: sh build/darwin/build_icns.sh

      - name: 打包 DMG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version wails.json)"
          STAGE="$(mktemp -d)"
          cp -R "build/bin/ClipSync.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "ClipSync" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "build/bin/ClipSync-${VERSION}-macos-universal.dmg"

      - name: 上传 DMG 产物
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-macos
          path: build/bin/*.dmg
          if-no-files-found: error

  build-windows:
    name: 构建 Windows EXE
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: 安装前端依赖
        working-directory: frontend
        run: npm install

      - name: 构建 Windows amd64
        run: wails build -platform windows/amd64

      - name: 重命名产物 (带版本号)
        shell: bash
        run: |
          VERSION="$(jq -r .version wails.json)"
          mv build/bin/ClipSync.exe "build/bin/ClipSync-${VERSION}-windows-amd64.exe"

      - name: 上传 EXE 产物
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-windows
          path: build/bin/ClipSync-*-windows-amd64.exe
          if-no-files-found: error

  build-linux:
    name: 构建 Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails Linux 需要 GTK3 + WebKitGTK；ubuntu-latest (24.04) 只有 4.1 系列，
      # 构建时需带 -tags webkit2_41（Wails CLI 不会自动探测）。
      # wl-clipboard 的 wl-copy / wl-paste 会被 AppImage 内置，供纯 Wayland 会话使用。
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev wl-clipboard

      # appimagetool 不在 Ubuntu 24.04 apt 仓库：从 AppImageKit 持续构建桶下载。
      # 用 /releases/download/continuous/ 而非 /latest/download/，后者在某些代理
      # 环境会被改写到不存在的 S3 对象、返回 404。
      - name: 安装 appimagetool
        run: |
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          sudo chmod 755 /usr/local/bin/appimagetool
          appimagetool --appimage-version || true

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: 安装前端依赖
        working-directory: frontend
        run: npm install

      - name: 构建 Linux amd64
        run: wails build -platform linux/amd64 -tags webkit2_41

      - name: 打包 AppImage
        run: sh build/linux/build_appimage.sh

      - name: 上传 AppImage 产物
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-linux
          path: build/bin/ClipSync-*-linux-*.AppImage
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        run: echo "version=$(jq -r .version wails.json)" >> "$GITHUB_OUTPUT"

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ClipSync v${{ steps.version.outputs.version }}
          files: artifacts/**/*
